name: Main Branch CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify backend modules
        run: |
          node -c backend/index.js
          node -c backend/config/email.js
          node -c backend/controllers/authController.js
          node -c backend/controllers/vaultController.js
          node -c backend/controllers/driveController.js

      - name: Execute Backend Tests
        run: npm run test:mcp
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-32-chars-long-min

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: ESLint Verification
        run: npm --workspace=frontend run lint

      - name: Production Build Verification
        run: npm --workspace=frontend run build
        env:
          VITE_API_URL: /api
